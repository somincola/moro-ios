name: CI

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'metadata/**'
      - 'output/**'
      - 'screenshots/**'
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'metadata/**'
      - 'output/**'
      - 'screenshots/**'
  workflow_dispatch:

concurrency:
  # Keep only the newest run for a pull request or branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Unit Test
    runs-on: macos-26
    timeout-minutes: 40
    env:
      SCHEME: moro
      PROJECT: moro.xcodeproj
      TEST_PLAN: Moro-UnitTests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Keep this pin aligned with the Xcode Cloud Release workflow (iPhone Duo needs the iOS 27.1 SDK).
      # Validate GitHub CI and Cloud Release before upgrading both environments.
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Ensure an iOS simulator (runtime + device) and pick it
        id: sim
        run: |
          set -uxo pipefail
          # -showdestinations lists only destinations the scheme can actually run
          # on, so simulators on runtimes older than the deployment target
          # are filtered out (plain `simctl list` does not filter).
          # `-showdestinations` is not ordered by runtime version. Selecting its
          # first iPhone can therefore run the suite on an older simulator even
          # when a newer runtime is installed. Parse every eligible destination
          # and deliberately choose the newest iOS runtime.
          pick() {
            xcodebuild -showdestinations -project "$PROJECT" -scheme "$SCHEME" 2>/dev/null \
              | python3 -c '
          import re
          import sys

          candidates = []
          for line in sys.stdin:
              if "platform:iOS Simulator" not in line:
                  continue
              identifier = re.search(r"\bid:\s*([0-9A-Fa-f-]+)", line)
              os_version = re.search(r"\bOS:\s*([0-9]+(?:\.[0-9]+)*)", line)
              device_name = re.search(r"\bname:\s*(iPhone[^,}]*)", line)
              if not (identifier and os_version and device_name):
                  continue
              version = tuple(int(part) for part in os_version.group(1).split("."))
              candidates.append((version, device_name.group(1).strip(), identifier.group(1)))

          if candidates:
              version, name, identifier = max(candidates, key=lambda item: (item[0], item[1]))
              print("%s|%s|%s" % (identifier, ".".join(map(str, version)), name))
          '
          }
          echo "Runtimes (before):"; xcrun simctl list runtimes || true
          SELECTION="$(pick)"
          UDID="${SELECTION%%|*}"
          if [ -z "$UDID" ]; then
            echo "No eligible iPhone destination — ensuring an iOS runtime is present."
            # The runner's Xcode does not always bundle its matching iOS simulator
            # runtime, so download it when none is available.
            if ! xcrun simctl list runtimes | grep 'iOS' | grep -vi -q unavailable; then
              echo "Downloading iOS platform (a few minutes)…"
              xcodebuild -downloadPlatform iOS || sudo xcodebuild -downloadPlatform iOS || true
            fi
            # Create an iPhone on the newest installed, available iOS runtime.
            RUNTIME="$(xcrun simctl list runtimes --json | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('platform')=='iOS' and r.get('isAvailable')]; rs.sort(key=lambda r:[int(x) for x in r['version'].split('.')]); print(rs[-1]['identifier'] if rs else '')")"
            DEVTYPE="$(xcrun simctl list devicetypes --json | python3 -c "import json,sys; ds=[d for d in json.load(sys.stdin)['devicetypes'] if d['name'].startswith('iPhone')]; print(ds[0]['identifier'] if ds else '')")"
            echo "Creating simulator on runtime=$RUNTIME devtype=$DEVTYPE"
            if [ -n "$RUNTIME" ] && [ -n "$DEVTYPE" ]; then
              xcrun simctl create ci-iphone "$DEVTYPE" "$RUNTIME" || true
            fi
            SELECTION="$(pick)"
            UDID="${SELECTION%%|*}"
          fi
          echo "Runtimes (after):"; xcrun simctl list runtimes || true
          echo "iOS Simulator destinations:"
          xcodebuild -showdestinations -project "$PROJECT" -scheme "$SCHEME" 2>/dev/null | grep 'platform:iOS Simulator' || true
          if [ -z "$UDID" ]; then
            echo "::error::No eligible iPhone simulator could be found or created"; exit 1
          fi
          IOS_VERSION="$(echo "$SELECTION" | cut -d'|' -f2)"
          DEVICE_NAME="$(echo "$SELECTION" | cut -d'|' -f3-)"
          echo "Using $DEVICE_NAME on iOS $IOS_VERSION ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & run unit tests
        run: |
          set -o pipefail
          # Ad-hoc sign for the simulator ("-"), with no team/profile, so the
          # build needs no Apple account or secrets yet still embeds entitlements
          # — keychain-backed tests fail with errSecMissingEntitlement (-34018)
          # if signing is disabled outright (CODE_SIGNING_ALLOWED=NO).
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -testPlan "$TEST_PLAN" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Upload test result bundle
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 3
          if-no-files-found: ignore

  ios26-compatibility:
    name: iOS 26.2 compatibility
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Require the iOS 26.2 runtime
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          runtime_id() {
            xcrun simctl list runtimes --json | ruby -rjson -e '
              runtime = JSON.parse(STDIN.read).fetch("runtimes").find do |item|
                item["identifier"].start_with?("com.apple.CoreSimulator.SimRuntime.iOS-") &&
                  item["version"] == "26.2" && item["isAvailable"]
              end
              puts runtime["identifier"] if runtime
            '
          }
          RUNTIME_ID="$(runtime_id)"
          if [[ -z "$RUNTIME_ID" ]]; then
            xcodebuild -downloadPlatform iOS -buildVersion 26.2
            RUNTIME_ID="$(runtime_id)"
          fi
          if [[ -z "$RUNTIME_ID" ]]; then
            echo "::error::iOS 26.2 is required; a newer runtime would mask the regression."
            exit 1
          fi
          xcrun simctl list runtimes
          UDID="$(xcrun simctl create 'Moro iOS 26.2 Compatibility' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$RUNTIME_ID")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run synchronous teardown and feature regressions on iOS 26.2
        run: |
          set -euo pipefail
          xcodebuild -project moro.xcodeproj -scheme moro \
            -configuration Debug -derivedDataPath CompatibilityDerivedData \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -testPlan Moro-UnitTests -parallel-testing-enabled NO \
            -only-testing:moroTests/IOS26DeinitCompatibilityTests \
            -only-testing:moroTests/RootTabCoordinatorTests \
            -only-testing:moroTests/TimelinePresentationTests \
            -only-testing:moroTests/TimelineLiveUpdatesTests \
            -only-testing:moroTests/NotificationSnapshotTests \
            -only-testing:moroTests/NotificationPolicySnapshotTests \
            -only-testing:moroTests/ComposePublishingTests \
            -only-testing:moroTests/ProfilePresentationTests \
            -resultBundlePath CompatibilityResults.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" test
          bash scripts/check-ios26-compatibility-results.sh CompatibilityResults.xcresult

      - name: Check Release teardown symbols including private child types
        run: |
          set -euo pipefail
          xcodebuild -project moro.xcodeproj -scheme moro \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath CompatibilityDerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" build
          bash scripts/check-isolated-deinits.sh \
            CompatibilityDerivedData/Build/Products/Release-iphonesimulator/moro.app/moro

      - name: Upload compatibility test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iOS-26.2-CompatibilityResults
          path: CompatibilityResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
