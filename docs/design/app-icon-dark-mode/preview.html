<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moro · 深色图标对比</title>
<style>
  :root { color-scheme: dark; --icon-size: 96px; --dark-bg: linear-gradient(#303030, #171717); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #111216; color: #f0eee9; font: 15px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; }
  main { max-width: 1280px; margin: auto; }
  h1 { margin: 0; font-size: 28px; font-weight: 650; }
  .intro, .note { color: #b6b4c0; }
  .intro { margin: 8px 0 24px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-bottom: 24px; }
  label { display: flex; align-items: center; gap: 8px; }
  select { padding: 7px 10px; border: 1px solid #494954; border-radius: 8px; background: #24242d; color: inherit; font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  article { padding: 18px; border: 1px solid #35353d; border-radius: 16px; background: #1a1b21; }
  h2 { font-size: 16px; margin: 0 0 16px; font-weight: 600; }
  .pair { display: flex; gap: 16px; justify-content: center; align-items: start; }
  figure { margin: 0; text-align: center; }
  .icon { width: var(--icon-size); height: var(--icon-size); border-radius: 22.5%; overflow: hidden; }
  .dark { background: var(--dark-bg); }
  img { display: block; width: 100%; height: 100%; }
  figcaption { margin-top: 8px; color: #b6b4c0; font-size: 12px; }
  article p { margin: 14px 0 0; font-size: 12px; line-height: 1.6; color: #c1bdca; }
  .note { font-size: 12px; margin-top: 24px; }
  body.large .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) { body { padding: 20px; } .grid, body.large .grid { grid-template-columns: 1fr; } }
</style>
<main>
  <h1>Moro · 深色图标对比</h1>
  <p class="intro">已同步四款图标的比例调整，检查浅色与深色版本的轮廓、留白、材质和小尺寸辨识度。</p>
  <div class="controls">
    <label>预览尺寸
      <select id="size">
        <option value="60">60 px · 小尺寸</option>
        <option value="96" selected>96 px · 对比</option>
        <option value="180">180 px · 边缘检查</option>
      </select>
    </label>
    <label>深色底色
      <select id="background">
        <option value="linear-gradient(#303030, #171717)" selected>深灰渐变</option>
        <option value="#000">纯黑 · 检查暗部</option>
        <option value="#555">中灰 · 检查白边</option>
        <option value="repeating-conic-gradient(#555 0% 25%, #333 0% 50%) 0 / 16px 16px">棋盘格 · 检查透明区域</option>
      </select>
    </label>
  </div>
  <section class="grid" id="grid" aria-label="六款图标对比"></section>
  <p class="note">右侧底色与圆角是网页模拟；最终呈现以 iOS 主屏幕为准。主屏幕图标外观由系统自定设置控制，可独立于应用内主题。Tinted 继续由系统自动生成。</p>
</main>
<script>
  const icons = [
    ['AppIcon', 'default', '默认', '保持几何象头、象牙白主体和紫色耳朵。'],
    ['AppIconRainbow', 'rainbow', '彩虹', '保留彩虹条带，检查紫色腿部与象鼻的辨识度。'],
    ['AppIconLiquidGlass', 'liquidglass', '液态玻璃', '放大 22%，保留反光与银色材质，让主体更醒目。'],
    ['AppIconPaintChaos', 'paintchaos', '泼彩', '中央白色象头放大约 25%，平滑过渡到保留原位置的外围飞溅。'],
    ['AppIconRisoGlitch', 'risoglitch', '故障', '主体缩小 16%，保留套印与颗粒，增加边缘留白。'],
    ['AppIconTornCollage', 'torncollage', '拼贴', '主体缩小 20%，保留纸张、铝箔与撕边，延展原背景。'],
  ];
  const assetRoot = '../../../moro/Resources/Assets.xcassets/';
  const grid = document.getElementById('grid');
  for (const [set, slug, title, description] of icons) {
    const article = document.createElement('article');
    article.innerHTML = `<h2>${title}</h2><div class="pair">
      <figure><div class="icon"><img alt="${title}浅色图标" src="${assetRoot}${set}.appiconset/appicon-${slug}-1024.png"></div><figcaption>浅色 · Any</figcaption></figure>
      <figure><div class="icon dark"><img alt="${title}深色图标" src="${assetRoot}${set}.appiconset/appicon-${slug}-dark-1024.png"></div><figcaption>深色 · Dark</figcaption></figure>
    </div><p>${description}</p>`;
    grid.appendChild(article);
  }
  document.getElementById('size').addEventListener('change', event => {
    document.documentElement.style.setProperty('--icon-size', `${event.target.value}px`);
    document.body.classList.toggle('large', Number(event.target.value) > 96);
  });
  document.getElementById('background').addEventListener('change', event => {
    document.documentElement.style.setProperty('--dark-bg', event.target.value);
  });
</script>
</html>
