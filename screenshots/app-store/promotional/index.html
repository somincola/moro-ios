<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moro App Store Screenshots</title>
    <style>
        :root {
            --text: #1b2230;
            --night: #18222f;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            overflow: hidden;
            background: #f4efe8;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        .canvas {
            position: relative;
            height: 2868px;
            overflow: hidden;
            isolation: isolate;
        }

        .single { width: 1320px; }
        .hero { width: 3960px; }
        .duo { width: 2640px; }

        .layer {
            position: absolute;
            z-index: -1;
            pointer-events: none;
        }

        /* Panorama 01–03: a sunrise over layered ridges, echoing the mountain post. */
        .hero {
            background:
                radial-gradient(circle at 2640px 1180px, rgba(255, 214, 160, .95) 0, rgba(255, 190, 140, .55) 360px, rgba(255, 170, 130, 0) 980px),
                linear-gradient(100deg, #172234 0%, #263955 26%, #4d5f80 44%, #c98d7c 64%, #f2c39d 80%, #fae6d0 100%);
        }

        .hero .ridge { left: 0; width: 3960px; }
        .hero .ridge-1 { bottom: 0; height: 1400px; background: rgba(23, 34, 52, .30); clip-path: polygon(0 38%, 9% 22%, 18% 34%, 29% 12%, 40% 30%, 52% 8%, 63% 26%, 74% 14%, 86% 30%, 100% 18%, 100% 100%, 0 100%); }
        .hero .ridge-2 { bottom: 0; height: 960px; background: rgba(23, 34, 52, .42); clip-path: polygon(0 30%, 12% 48%, 24% 22%, 35% 44%, 47% 26%, 58% 50%, 70% 24%, 82% 46%, 92% 30%, 100% 40%, 100% 100%, 0 100%); }
        .hero .ridge-3 { bottom: 0; height: 560px; background: rgba(23, 34, 52, .58); clip-path: polygon(0 40%, 15% 18%, 30% 46%, 44% 28%, 57% 54%, 71% 30%, 85% 52%, 100% 32%, 100% 100%, 0 100%); }
        .hero .mist { left: 0; bottom: 0; width: 3960px; height: 1100px; background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(255, 240, 228, .16)); }

        /* Panorama 07–08: an evening sea for the seaside poll. */
        .duo {
            background:
                radial-gradient(circle at 2050px 1240px, rgba(255, 210, 170, .75) 0, rgba(255, 190, 150, 0) 760px),
                linear-gradient(180deg, #13324a 0%, #1f5a72 38%, #4d93a3 62%, #a9cfcf 80%, #efe0c4 100%);
        }

        .duo .wave { left: 0; width: 2640px; }
        .duo .wave-1 { bottom: 0; height: 760px; background: rgba(255, 255, 255, .16); clip-path: polygon(0 34%, 10% 28%, 22% 36%, 34% 26%, 46% 34%, 58% 24%, 70% 32%, 82% 22%, 92% 30%, 100% 26%, 100% 100%, 0 100%); }
        .duo .wave-2 { bottom: 0; height: 420px; background: rgba(247, 232, 205, .85); clip-path: polygon(0 40%, 14% 30%, 28% 42%, 42% 28%, 56% 40%, 70% 26%, 84% 38%, 100% 28%, 100% 100%, 0 100%); }

        /* Single slides: soft paper gradients with a warm glow. */
        .single { background: linear-gradient(180deg, var(--top), var(--bottom)); }
        .single .glow { right: -260px; top: -240px; width: 1080px; height: 1080px; border-radius: 50%; background: radial-gradient(circle, var(--glow) 0, rgba(255, 255, 255, 0) 68%); }
        .single .arc { left: -200px; right: -200px; bottom: -1180px; height: 2200px; border-radius: 50%; background: var(--arc); }

        .single.thread   { --top: #fbf3e4; --bottom: #f2dfbf; --glow: rgba(255, 255, 255, .85); --arc: rgba(214, 160, 92, .16); --accent: #a8662a; }
        .single.explore  { --top: #eef5f7; --bottom: #d3e6ee; --glow: rgba(255, 255, 255, .9);  --arc: rgba(66, 128, 156, .14); --accent: #2f6f8c; }
        .single.profile  { --top: #f1f5ec; --bottom: #d8e5cf; --glow: rgba(255, 255, 255, .9);  --arc: rgba(92, 134, 86, .15);  --accent: #4b7a44; }
        .single.inbox    { --top: #f4f0fa; --bottom: #e0d7f1; --glow: rgba(255, 255, 255, .9);  --arc: rgba(118, 94, 170, .14); --accent: #6a52a3; }
        .single.display  { --top: #fbf0ee; --bottom: #f0d5cf; --glow: rgba(255, 255, 255, .9);  --arc: rgba(196, 106, 96, .14); --accent: #b2574c; }

        .brand {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 26px;
            z-index: 8;
        }

        .brand img {
            width: 112px;
            height: 112px;
            border-radius: 26px;
            box-shadow: 0 18px 42px rgba(16, 26, 40, .22);
        }

        .brand b { font-size: 54px; line-height: 1; }
        .brand.light { color: white; }
        .hero .brand, .duo .brand, .single .brand { left: 96px; top: 112px; }

        .copy { position: absolute; z-index: 7; }

        .copy .eyebrow {
            margin-bottom: 26px;
            font-size: 30px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--accent, currentColor);
        }

        .copy.light .eyebrow { color: rgba(255, 255, 255, .72); }
        .hero-feature .eyebrow { color: #a0573a; }

        .copy h1 {
            margin: 0;
            font-size: 104px;
            line-height: 1.06;
            font-weight: 760;
        }

        .copy p {
            margin: 34px 0 0;
            font-size: 41px;
            line-height: 1.32;
            font-weight: 500;
            opacity: .72;
        }

        :lang(zh) .copy h1 { line-height: 1.16; letter-spacing: .02em; }
        :lang(zh) .copy p { line-height: 1.5; letter-spacing: .02em; }
        :lang(zh) .copy .eyebrow { letter-spacing: .14em; }

        .copy.light { color: white; }
        .copy.light p { opacity: .82; }

        .hero-copy { left: 96px; top: 430px; width: 1020px; }
        .hero-copy h1 { font-size: 118px; }

        .hero-feature { left: 2980px; top: 1240px; width: 860px; color: var(--night); }
        .hero-feature h1 { font-size: 80px; }
        .hero-feature p { font-size: 36px; }

        .single-copy { top: 270px; left: 82px; right: 82px; text-align: center; }
        .single-copy p { max-width: 1040px; margin-inline: auto; }

        .duo-copy { left: 96px; top: 380px; width: 660px; }
        .duo-copy h1 { font-size: 98px; }
        .duo-copy p { font-size: 36px; }

        .duo-feature { left: 1940px; top: 380px; width: 600px; }
        .duo-feature h1 { font-size: 64px; }
        .duo-feature p { font-size: 32px; }

        .phone-wrap { position: absolute; z-index: 4; transform-origin: center; }
        .single-phone { left: 230px; top: 790px; transform: scale(1.1); transform-origin: top center; }
        .hero-phone { left: 1420px; top: 300px; transform: rotate(14deg) scale(1.46); }
        .duo-phone { left: 1060px; top: 420px; transform: rotate(-12deg) scale(1.26); }

        /* 792 × 1721 keeps the 1320 × 2868 capture at its native aspect ratio. */
        .phone {
            position: relative;
            width: 860px;
            padding: 24px;
            border: 10px solid #111317;
            border-radius: 142px;
            background: #111317;
            box-shadow: 0 60px 110px rgba(16, 26, 40, .28), 0 18px 40px rgba(16, 26, 40, .16), inset 0 8px 0 rgba(255, 255, 255, .16);
        }

        .screen {
            position: relative;
            width: 792px;
            height: 1721px;
            overflow: hidden;
            border-radius: 108px;
            background: white;
        }

        .screen img { display: block; width: 100%; height: 100%; }

        .island {
            position: absolute;
            top: 20px;
            left: 50%;
            z-index: 2;
            width: 226px;
            height: 66px;
            border-radius: 99px;
            background: black;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
<script>
    const params = new URLSearchParams(location.search);
    const locale = params.get("lang") || "en-US";
    const mode = params.get("mode") || "hero";
    const zh = locale.startsWith("zh");
    document.documentElement.lang = zh ? "zh-Hans" : "en";

    const icon = "../../../moro/Resources/Assets.xcassets/AppIcon.appiconset/appicon-default-1024.png";
    const shot = (name) => `../${locale}/iphone/${name}.png`;

    const phone = (name, className) =>
        `<div class="phone-wrap ${className}"><div class="phone"><div class="screen"><img src="${shot(name)}" alt=""><div class="island"></div></div></div></div>`;
    const brand = (light = false) => `<div class="brand ${light ? "light" : ""}"><img src="${icon}" alt=""><b>Moro</b></div>`;
    const copy = (className, c) =>
        `<div class="copy ${className}">${c.eyebrow ? `<div class="eyebrow">${c.eyebrow}</div>` : ""}<h1>${c.title}</h1>${c.body ? `<p>${c.body}</p>` : ""}</div>`;

    const text = zh ? {
        hero: { title: "联邦宇宙里，<br>一个安静的家", body: "在开放的社交网络里，<br>阅读、相遇、分享生活。" },
        heroFeature: { eyebrow: "时间线", title: "每个瞬间，<br>都清晰好看", body: "照片、对话和你关注的人，<br>集中在一条专注的时间线里。" },
        thread: { eyebrow: "对话", title: "完整的对话脉络", body: "回复按上下文排列，<br>读嘟文串就像聊天一样自然。" },
        explore: { eyebrow: "发现", title: "遇见志趣相投的人", body: "跨实例搜索用户、嘟文和话题标签。" },
        profile: { eyebrow: "个人主页", title: "属于你的小天地", body: "简介、资料、嘟文和媒体，一处呈现。" },
        compose: { eyebrow: "发嘟", title: "用你的方式<br>表达", body: "投票、图片、表情和可见范围，写作时随手可用。" },
        composeFeature: { title: "写作所需，<br>触手可及", body: "内容警告、发帖语言、草稿与引用权限，一应俱全。" },
        inbox: { eyebrow: "通知", title: "动态一目了然", body: "提及、喜欢、转嘟和关注，<br>分组整理，清爽不打扰。" },
        display: { eyebrow: "个性化", title: "让 Moro 更像你", body: "外观、字号、主题色和应用图标，<br>随心调整。" },
    } : {
        hero: { title: "A calmer home for the fediverse", body: "Read, connect, and share everyday life across the open social web." },
        heroFeature: { eyebrow: "Timeline", title: "Every moment, beautifully clear", body: "Photos, conversations, and the people you follow—in one focused timeline." },
        thread: { eyebrow: "Conversations", title: "Follow every conversation", body: "Replies stay in context, so threads read like a real conversation." },
        explore: { eyebrow: "Discover", title: "Find your people", body: "Search accounts, posts, and hashtags across the open social web." },
        profile: { eyebrow: "Profiles", title: "A space that feels like yours", body: "Your bio, fields, posts, and media—together in one place." },
        compose: { eyebrow: "Post", title: "Say it your way", body: "Polls, photos, emoji, and visibility—right where you write." },
        composeFeature: { title: "Everything you need, right where you write", body: "Content warnings, posting language, drafts, and quote controls." },
        inbox: { eyebrow: "Notifications", title: "Every signal, easy to scan", body: "Mentions, likes, boosts, and follows—grouped and calm." },
        display: { eyebrow: "Personalize", title: "Make Moro yours", body: "Tune the appearance, text size, theme color, and app icon." },
    };

    const single = (theme, c, screen) =>
        `<main class="canvas single ${theme}"><div class="layer glow"></div><div class="layer arc"></div>${brand()}${copy("single-copy", c)}${phone(screen, "single-phone")}</main>`;

    const views = {
        hero: `<main class="canvas hero"><div class="layer ridge ridge-1"></div><div class="layer ridge ridge-2"></div><div class="layer ridge ridge-3"></div><div class="layer mist"></div>${brand(true)}${copy("hero-copy light", text.hero)}${copy("hero-feature", text.heroFeature)}${phone("home-light", "hero-phone")}</main>`,
        "4": single("thread", text.thread, "thread"),
        "5": single("explore", text.explore, "explore"),
        "6": single("profile", text.profile, "profile"),
        compose: `<main class="canvas duo"><div class="layer wave wave-1"></div><div class="layer wave wave-2"></div>${brand(true)}${copy("duo-copy light", text.compose)}${copy("duo-feature light", text.composeFeature)}${phone("compose", "duo-phone")}</main>`,
        "9": single("inbox", text.inbox, "inbox"),
        "10": single("display", text.display, "display"),
    };

    document.body.innerHTML = views[mode] || views.hero;
</script>
</body>
</html>
